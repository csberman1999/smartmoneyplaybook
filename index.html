<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Playbook | Smart Money</title>
<!-- Vercel Web Analytics: aggregate visits only. Requires Web Analytics
     to be enabled in the Vercel project dashboard to record anything. -->
<script defer src="/_vercel/insights/script.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0A0A0F;
    --surface:  #111118;
    --border:   #252535;
    --border2:  #1a1a22;
    --gold:     #D4A843;
    --gold-dim: #c49a38;
    --text:     #E8E8E8;
    --muted:    #6B6B80;
    --faint:    #3a3a50;
    --red:      #e05252;
    --nfl-text: #86EFAC; --nfl-border: #16a34a; --nfl-bg: #052e16;
    --nba-text: #93C5FD; --nba-border: #2563eb; --nba-bg:  #0c1a3a;
    --both-text:#C4B5FD; --both-border:#7c3aed; --both-bg: #1a0f30;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }

  /* ── grid bg ── */
  body::before {
    content: '';
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* ── screens ── */
  .screen { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; }
  .screen.hidden { display: none !important; }

  /* ═══════════════════════════════════════
     DASHBOARD
  ═══════════════════════════════════════ */
  #dashboard {
    overflow-y: auto;
  }

  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border2);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-shrink: 0;
  }

  .dash-brand { display: flex; flex-direction: column; gap: .15rem; }
  .dash-brand-sup { font-size: .6rem; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); }
  .dash-brand-title { font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -.01em; }

  .btn-logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: .7rem;
    padding: .35rem .75rem;
    border-radius: .375rem;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    letter-spacing: .05em;
  }
  .btn-logout:hover { border-color: var(--border); color: var(--text); }

  .dash-body {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-bottom: 1.25rem;
  }
  .section-header + .level-grid { margin-bottom: 2.5rem; }

  .track-badge {
    font-size: .6rem;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    padding: .25rem .6rem;
    border-radius: .25rem;
    border: 1px solid;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .track-badge.nfl  { color: var(--nfl-text);  border-color: var(--nfl-border);  background: var(--nfl-bg); }
  .track-badge.nba  { color: var(--nba-text);  border-color: var(--nba-border);  background: var(--nba-bg); }
  .track-badge.both { color: var(--both-text); border-color: var(--both-border); background: var(--both-bg); }

  .section-line { flex: 1; height: 1px; background: var(--border2); }

  .level-grid {
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }

  .level-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .625rem;
    padding: 1rem 1.125rem;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
    overflow: hidden;
    text-align: left;
    color: inherit;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .level-card:hover { border-color: var(--gold); background: #14140e; }
  .level-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--gold);
    opacity: 0;
    transition: opacity .2s;
  }
  .level-card:hover::before { opacity: 1; }

  .level-num {
    width: 2.125rem; height: 2.125rem;
    flex-shrink: 0;
    background: #1a1a26;
    border: 1px solid var(--border);
    border-radius: .4rem;
    display: flex; align-items: center; justify-content: center;
    font-size: .75rem;
    font-weight: 700;
    color: var(--muted);
  }
  .level-card:hover .level-num { color: var(--gold); border-color: rgba(212,168,67,.4); }

  .card-body { flex: 1; min-width: 0; display: block; }

  .card-title {
    display: block;
    font-size: .82rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: .25rem;
  }
  .level-card:hover .card-title { color: #fff; }

  .card-desc {
    display: block;
    font-size: .72rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .card-aside {
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-shrink: 0;
  }

  .card-arrow {
    color: var(--faint);
    display: flex;
    transition: color .2s, transform .2s;
  }
  .level-card:hover .card-arrow { color: var(--gold); transform: translateX(3px); }

  @media (max-width: 560px) {
    .level-card { gap: .75rem; padding: .875rem 1rem; }
    .card-aside .track-badge { display: none; }
  }

  .dash-footer {
    border-top: 1px solid var(--border2);
    padding: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .dash-footer span { font-size: .65rem; color: var(--faint); letter-spacing: .05em; }

  /* ═══════════════════════════════════════
     VIEWER
  ═══════════════════════════════════════ */
  #viewer {
    flex-direction: column;
  }

  .viewer-bar {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: 0 1rem;
    height: 3.25rem;
    border-bottom: 1px solid var(--border2);
    background: var(--bg);
    flex-shrink: 0;
  }

  .btn-back {
    display: flex;
    align-items: center;
    gap: .4rem;
    background: none;
    border: none;
    color: var(--muted);
    font-size: .8rem;
    cursor: pointer;
    padding: .35rem .5rem;
    border-radius: .375rem;
    transition: color .15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-back:hover { color: var(--text); }

  .viewer-divider { width: 1px; height: 1.25rem; background: var(--border); }

  .viewer-title {
    font-size: .8rem;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .viewer-frame-wrap {
    flex: 1;
    padding: .75rem;
    min-height: 0;
  }

  #level-frame {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: .625rem;
    background: var(--bg);
    display: block;
  }
</style>
</head>
<body>

<!-- Login screen removed: Cloudflare Access authenticates before this page loads. -->

<!-- ══════════════ DASHBOARD ══════════════ -->
<div id="dashboard" class="screen hidden">

  <div class="dash-header">
    <div class="dash-brand">
      <span class="dash-brand-sup">Smart Money</span>
      <span class="dash-brand-title">THE PLAYBOOK</span>
    </div>
    <button class="btn-logout" id="btn-logout">Sign out</button>
  </div>

  <div class="dash-body">

    <!-- NFL -->
    <div class="section-header">
      <span class="track-badge nfl">NFL Track</span>
      <div class="section-line"></div>
    </div>
    <div class="level-grid" id="grid-nfl"></div>

    <!-- NBA -->
    <div class="section-header">
      <span class="track-badge nba">NBA Track</span>
      <div class="section-line"></div>
    </div>
    <div class="level-grid" id="grid-nba"></div>

    <!-- All Athletes -->
    <div class="section-header">
      <span class="track-badge both">NFL · NBA</span>
      <div class="section-line"></div>
    </div>
    <div class="level-grid" id="grid-both"></div>

  </div>

  <div class="dash-footer">
    <span>Smart Money · Financial Literacy</span>
    <span>For educational purposes only</span>
  </div>

</div>

<!-- ══════════════ VIEWER ══════════════ -->
<div id="viewer" class="screen hidden">

  <div class="viewer-bar">
    <button class="btn-back" id="btn-back">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
      Dashboard
    </button>
    <div class="viewer-divider"></div>
    <span class="viewer-title" id="viewer-title"></span>
  </div>

  <div class="viewer-frame-wrap">
    <iframe id="level-frame" src="" title="Level content" allow="fullscreen"></iframe>
  </div>

</div>

<script>
  // Access control lives in Cloudflare Access, not in this file.
  // To add or remove people: Cloudflare Zero Trust → Access → Applications
  // → The Playbook → the "Approved Users" policy → edit the email list.

  var levels = [
    {
      id: 'nfl-intro', order: 1, track: 'nfl',
      title: 'Level 1 — NFL Financial Literacy Introduction',
      desc:  'Foundational financial literacy for NFL players — where the money goes, tax basics, the first-check reality.',
      url:   'index-nfl-players.html'
    },
    {
      id: 'nba-intro', order: 1, track: 'nba',
      title: 'Level 1 — NBA Financial Literacy Introduction',
      desc:  'Foundational financial literacy for NBA players — where the money goes, tax basics, the first-check reality.',
      url:   'index-nba-players.html'
    },
    {
      id: 'foundation', order: 2, track: 'both',
      title: 'Level 2 — The Foundation',
      desc:  'Budgeting, compounding, inflation, and the core concepts every long-term financial plan is built on.',
      url:   'index-nba-level2.html'
    },
    {
      id: 'tax-wealth', order: 3, track: 'both',
      title: 'Level 3 — Tax and Wealth Structuring',
      desc:  'State tax positioning, entity concepts, and how contract structure interacts with long-term wealth.',
      url:   'index-level3.html'
    },
    {
      id: 'alternatives', order: 4, track: 'both',
      title: 'Level 4 — Alternative Investments & Private Markets',
      desc:  'How private equity, venture, and alternative structures actually work — and what to watch for.',
      url:   'index-level4.html'
    },
    {
      id: 'business', order: 5, track: 'both',
      title: 'Level 5 — Building a Business',
      desc:  'From NIL/marketing income to standalone ventures — the second-act groundwork.',
      url:   'index-level5.html'
    },
    {
      id: 'legacy', order: 6, track: 'both',
      title: 'Level 6 — Legacy & Generational Wealth',
      desc:  'Estate concepts, generational transfer, and planning for a life and family beyond the career.',
      url:   'index-level6.html'
    },
  ];

  // ── utils ──
  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }

  // ── card builder ──
  function buildCard(level) {
    var card = document.createElement('button');
    card.className = 'level-card';
    card.innerHTML =
      '<span class="level-num">' + level.order + '</span>' +
      '<span class="card-body">' +
        '<span class="card-title">' + level.title + '</span>' +
        '<span class="card-desc">' + level.desc + '</span>' +
      '</span>' +
      '<span class="card-aside">' +
        '<span class="track-badge ' + level.track + '">' +
          (level.track === 'nfl' ? 'NFL' : level.track === 'nba' ? 'NBA' : 'NFL · NBA') +
        '</span>' +
        '<span class="card-arrow">' +
          '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>' +
        '</span>' +
      '</span>';

    card.addEventListener('click', function() { openLevel(level); });
    return card;
  }

  function renderDashboard() {
    var nfl  = document.getElementById('grid-nfl');
    var nba  = document.getElementById('grid-nba');
    var both = document.getElementById('grid-both');
    nfl.innerHTML = ''; nba.innerHTML = ''; both.innerHTML = '';

    levels.forEach(function(level) {
      var card = buildCard(level);
      if (level.track === 'nfl')       nfl.appendChild(card);
      else if (level.track === 'nba')  nba.appendChild(card);
      else                             both.appendChild(card);
    });
  }

  // ── routing ──
  function goDashboard() {
    hide('viewer');
    var frame = document.getElementById('level-frame');
    frame.src = '';
    show('dashboard');
  }

  function openLevel(level) {
    document.getElementById('viewer-title').textContent = level.title;
    document.getElementById('level-frame').src = level.url;
    hide('dashboard');
    show('viewer');
  }

  // ── sign out ──
  // Access is enforced by Cloudflare before this page ever loads, so signing
  // out means ending the Cloudflare Access session, not a local one.
  document.getElementById('btn-logout').addEventListener('click', function() {
    window.location.href = '/cdn-cgi/access/logout';
  });

  document.getElementById('btn-back').addEventListener('click', goDashboard);

  // ── init ──
  // No local gate: Cloudflare Access authenticates before this page is served.
  renderDashboard();
  goDashboard();
</script>

</body>
</html>
