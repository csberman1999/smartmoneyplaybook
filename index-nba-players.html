    // ═══════════════════════════════════════════════════
    // CALCULATIONS
    // ═══════════════════════════════════════════════════

    // PV of growing annuity: PV = PMT/(r-g) * [1 - ((1+g)/(1+r))^n]
    function nestEggRequired(monthly, portfolioRate, inflationRate, years) {
      const pmt = monthly * 12;
      const r = portfolioRate / 100;
      const g = inflationRate / 100;
      if (Math.abs(r - g) < 0.0001) return pmt * years;
      return (pmt / (r - g)) * (1 - Math.pow((1 + g) / (1 + r), years));
    }

    // futureSpend = monthlySpend * (1+g)^yearsUntilAge
    function futureMonthlySpend(monthly, inflationRate, currentAge, targetAge) {
      return monthly * Math.pow(1 + inflationRate / 100, Math.max(0, targetAge - currentAge));
    }

    // Gross earnings needed at 49% effective net
    function grossEarningsNeeded(nestEgg) { return nestEgg / 0.49; }

    // Simulate year-by-year depletion
    function depletionAge(startBalance, monthly, portfolioRate, inflationRate, currentAge) {
      const r = portfolioRate / 100, g = inflationRate / 100;
      let bal = startBalance, draw = monthly * 12;
      for (let age = currentAge; age <= 110; age++) {
        bal = bal * (1 + r) - draw;
        draw *= (1 + g);
        if (bal <= 0) return age;
      }
      return 110;
    }

    // Portfolio projection data for chart
    function portfolioProjection(nestEgg, currentPortfolio, monthly, portfolioRate, inflationRate, currentAge, lifeExp) {
      const r = portfolioRate / 100, g = inflationRate / 100;
      const data = [];
      let tBal = nestEgg, cBal = currentPortfolio, draw = monthly * 12;
      for (let age = currentAge; age <= lifeExp; age++) {
        data.push({ age, target: Math.max(0, tBal), current: Math.max(0, cBal) });
        tBal = tBal * (1 + r) - draw;
        cBal = cBal * (1 + r) - draw;
        draw *= (1 + g);
      }
      return data;
    }

    // Binary search for sustainable monthly draw
    function sustainableMonthly(startBalance, portfolioRate, inflationRate, years) {
      const r = portfolioRate / 100, g = inflationRate / 100;
      let lo = 500, hi = 2000000;
      for (let i = 0; i < 70; i++) {
        const mid = (lo + hi) / 2;
        let bal = startBalance, ann = mid * 12;
        for (let yr = 0; yr < years; yr++) { bal = bal * (1 + r) - ann; ann *= (1 + g); }
        if (bal > 0) lo = mid; else hi = mid;
      }
      return Math.round((lo + hi) / 2);
    }

    // FV = PV * (1+r)^n
    function compoundFV(pv, rate, years) { return pv * Math.pow(1 + rate / 100, years); }

    // Real purchasing power
    function realPurchasingPower(nominal, rate, years) {
      return nominal / Math.pow(1 + rate / 100, years);
    }

    // Sharpe = (return - 5%) / volatility
    function sharpeRatio(ret, vol) {
      if (vol === 0) return 0;
      return (ret - 5) / vol;
    }

    // Fee drag cost
    function feeDragCost(size, grossReturn, feeRate, years) {
      const r = grossReturn / 100, f = feeRate / 100;
      return size * Math.pow(1 + r, years) - size * Math.pow(1 + r - f, years);
    }

    // Hedge fund 2+20 net return
    function hedgeFundNetReturn(grossPct) {
      const g = grossPct / 100;
      return (g - 0.02 - Math.max(0, g - 0.05) * 0.2) * 100;
    }

    // Format helpers
    function fmt$(n, compact = false) {
      if (compact) {
        if (n >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
        if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
        if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
        return '$' + Math.round(n).toLocaleString();
      }
      return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 }).format(n);
    }
    function fmtM(n) { return '$' + (n/1e6).toFixed(2) + 'M'; }

    function useCountUp(target, active, duration=1500) {
      const [val, setVal] = useState(0);
      const raf = useRef(null);
      useEffect(() => {
        if (!active) return;
        const start = performance.now();
        const step = now => {
          const t = Math.min((now - start)/duration, 1);
          const e = 1 - Math.pow(1-t, 3);
          setVal(Math.round(target * e));
          if (t < 1) raf.current = requestAnimationFrame(step);
        };
        raf.current = requestAnimationFrame(step);
        return () => { if (raf.current) cancelAnimationFrame(raf.current); };
      }, [target, active, duration]);
      return val;
    }
