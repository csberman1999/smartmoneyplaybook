<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Money | Level Two — Financial Education for NBA Players</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="/vendor/react.min.js" crossorigin></script>
  <script src="/vendor/react-dom.min.js" crossorigin></script>
  <script src="/vendor/prop-types.min.js" crossorigin></script>
  <script src="/vendor/recharts.js" crossorigin></script>
  <script src="/vendor/babel.min.js"></script>
  <script>
  (function() {
    Babel.registerPreset("react", function() {
      return { plugins: [
        [Babel.availablePlugins["transform-react-jsx"], { runtime: "classic" }],
        Babel.availablePlugins["transform-react-display-name"]
      ]};
    });
  })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #080808;
      color: #E8E8E8;
      font-family: 'Open Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4A843; }
    .bebas { font-family: 'Bebas Neue', cursive; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 640px) { .container { padding: 0 24px; } }
    .card {
      background: #111111;
      border-radius: 12px;
      border: 1px solid #1e1e1e;
      padding: 20px;
    }
    .section-heading {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: 0.04em;
      line-height: 1;
      color: white;
      text-transform: uppercase;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr; }
    }
    button { font-family: 'Open Sans', sans-serif; }

    /* Responsive nav: desktop unchanged; phones get a compact scrollable strip */
    .nav-row { display:flex; align-items:center; justify-content:space-between; min-height:56px; gap:8px; }
    .nav-links { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .nav-links.tight { gap:2px; }
    @media (max-width: 820px) {
      .nav-row { flex-direction:column; align-items:stretch; gap:0; min-height:0; padding-top:8px; }
      .nav-links {
        flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start;
        margin-top:6px; padding-bottom:8px;
        -webkit-overflow-scrolling:touch; scrollbar-width:none;
      }
      .nav-links::-webkit-scrollbar { display:none; }
      .nav-links > button { flex:0 0 auto; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    // ═══════════════════════════════════════════════════
    // SHARED COMPONENTS
    // ═══════════════════════════════════════════════════

    function CourtDivider() {
      return (
        <div style={{ position:'relative', height:48, overflow:'hidden', display:'flex', alignItems:'center' }}>
          <svg viewBox="0 0 800 48" style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.06 }}>
            <line x1="400" y1="0" x2="400" y2="48" stroke="#D4A843" strokeWidth="2"/>
            <circle cx="400" cy="24" r="20" stroke="#D4A843" strokeWidth="2" fill="none"/>
            <path d="M 150 0 Q 200 24 150 48" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <path d="M 650 0 Q 600 24 650 48" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <rect x="120" y="8" width="70" height="32" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <rect x="610" y="8" width="70" height="32" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
          </svg>
          <div style={{ width:'100%', height:1, background:'linear-gradient(90deg,transparent,#D4A843 20%,#D4A843 80%,transparent)' }}/>
        </div>
      );
    }

    function SectionLabel({ num, title }) {
      return (
        <div style={{ marginBottom:40 }}>
          <p className="bebas" style={{ color:'#D4A843', letterSpacing:'0.1em', fontSize:'1.1rem', marginBottom:8 }}>Section {num}</p>
          <h2 className="section-heading">{title}</h2>
          <div style={{ width:64, height:3, background:'#D4A843', borderRadius:2, marginTop:14 }}/>
        </div>
      );
    }

    function ComplianceNote({ children }) {
      return (
        <div style={{
          borderLeft:'4px solid #D4A843', background:'#0D0D0D',
          padding:'14px 18px', borderRadius:'0 8px 8px 0',
          fontSize:'0.78rem', color:'#777', lineHeight:1.7, marginTop:32,
        }}>
          <strong style={{ color:'#D4A843' }}>Education note: </strong>{children}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // NAV
    // ═══════════════════════════════════════════════════

    const SECTIONS = [
      { id:'foundation',      label:'The Foundation' },
      { id:'career-arc',      label:'Career Arc' },
      { id:'real-estate',     label:'Real Estate' },
      { id:'pitch-room',      label:'The Pitch Room' },
      { id:'protection',      label:'Protection First' },
      { id:'the-team',        label:'The Team & The Circle' },
      { id:'second-chapter',  label:'The Second Chapter' },
    ];

    function Nav() {
      const [active, setActive] = useState('foundation');
      const [open, setOpen] = useState(false);

      useEffect(() => {
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
        }, { threshold: 0.3 });
        SECTIONS.forEach(({ id }) => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);

      const scrollTo = id => { document.getElementById(id)?.scrollIntoView({ behavior:'smooth' }); setOpen(false); };

      return (
        <nav style={{
          position:'sticky', top:0, zIndex:50, width:'100%',
          background:'rgba(8,8,8,0.95)', backdropFilter:'blur(12px)',
          borderBottom:'1px solid #222',
        }}>
          <div className="container">
            <div className="nav-row">
              <div style={{ display:'flex', flexDirection:'column', lineHeight:1 }}>
                <span className="bebas" style={{ color:'#D4A843', letterSpacing:'0.1em', fontSize:'1.2rem' }}>SMART MONEY</span>
                <span style={{ color:'#444', fontSize:'0.55rem', textTransform:'uppercase', letterSpacing:'0.15em', marginTop:2 }}>Level Two</span>
              </div>
              <div className="nav-links tight">
                {SECTIONS.map(({ id, label }) => (
                  <button key={id} onClick={() => scrollTo(id)} style={{
                    padding:'4px 10px', fontSize:'0.63rem', fontWeight:600,
                    textTransform:'uppercase', letterSpacing:'0.04em',
                    color: active===id ? '#D4A843' : '#555',
                    background:'none', border:'none',
                    borderBottom: active===id ? '2px solid #D4A843' : '2px solid transparent',
                    cursor:'pointer', whiteSpace:'nowrap',
                  }}>{label}</button>
                ))}
              </div>
            </div>
          </div>
        </nav>
      );
    }

    // ═══════════════════════════════════════════════════
    // HERO
    // ═══════════════════════════════════════════════════

    function Hero() {
      const [vis, setVis] = useState(false);
      useEffect(() => { setTimeout(() => setVis(true), 100); }, []);

      return (
        <div style={{
          position:'relative', display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center',
          padding:'96px 16px 80px',
          background:'linear-gradient(180deg,#0D0D0D 0%,#080808 100%)',
          overflow:'hidden',
        }}>
          <svg viewBox="0 0 600 400" style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.04 }} preserveAspectRatio="xMidYMid slice">
            <rect x="50" y="50" width="500" height="300" stroke="#D4A843" strokeWidth="3" fill="none"/>
            <line x1="300" y1="50" x2="300" y2="350" stroke="#D4A843" strokeWidth="2"/>
            <circle cx="300" cy="200" r="60" stroke="#D4A843" strokeWidth="2" fill="none"/>
            <rect x="50" y="120" width="130" height="160" stroke="#D4A843" strokeWidth="2" fill="none"/>
            <rect x="420" y="120" width="130" height="160" stroke="#D4A843" strokeWidth="2" fill="none"/>
            <circle cx="180" cy="200" r="60" stroke="#D4A843" strokeWidth="2" fill="none"/>
            <circle cx="420" cy="200" r="60" stroke="#D4A843" strokeWidth="2" fill="none"/>
          </svg>

          <div style={{ width:64, height:4, background:'#D4A843', borderRadius:2, marginBottom:32 }}/>

          <div style={{
            textAlign:'center',
            opacity: vis ? 1 : 0,
            transform: vis ? 'translateY(0)' : 'translateY(30px)',
            transition: 'opacity 1s ease, transform 1s ease',
          }}>
            <div className="bebas" style={{ fontSize:'clamp(4rem,20vw,11rem)', letterSpacing:'0.06em', lineHeight:1, color:'white' }}>SMART</div>
            <div className="bebas" style={{ fontSize:'clamp(4rem,20vw,11rem)', letterSpacing:'0.06em', lineHeight:1, color:'#D4A843', textShadow:'0 0 80px rgba(212,168,67,0.3)' }}>MONEY</div>
          </div>

          <div style={{
            marginTop:24,
            display:'inline-flex', alignItems:'center', gap:10,
            opacity: vis ? 1 : 0, transform: vis ? 'translateY(0)' : 'translateY(20px)',
            transition:'opacity 1s ease 0.2s, transform 1s ease 0.2s',
          }}>
            <div style={{ width:24, height:1, background:'#444' }}/>
            <span className="bebas" style={{ color:'#D4A843', letterSpacing:'0.25em', fontSize:'0.95rem' }}>LEVEL TWO</span>
            <div style={{ width:24, height:1, background:'#444' }}/>
          </div>

          <p style={{
            marginTop:20, textAlign:'center', fontWeight:600,
            textTransform:'uppercase', letterSpacing:'0.15em',
            fontSize:'0.75rem', color:'#555',
            opacity: vis ? 1 : 0, transition:'opacity 1s ease 0.4s',
          }}>
            Financial Education for Professional Athletes
          </p>

          <div style={{ marginTop:48, display:'flex', flexDirection:'column', alignItems:'center', gap:8, opacity: vis?1:0, transition:'opacity 1s ease 0.6s' }}>
            <span style={{ fontSize:'0.6rem', textTransform:'uppercase', letterSpacing:'0.1em', color:'#333' }}>Scroll to explore</span>
            <div style={{ width:1, height:32, background:'linear-gradient(180deg,#D4A843,transparent)' }}/>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // SECTION 01 — THE FOUNDATION
    // ═══════════════════════════════════════════════════

    function SectionFoundation() {
      const pillars = [
        {
          title:'The Number',
          color:'#D4A843',
          body:'Financial freedom has a cost. Monthly spend × life expectancy × inflation = the nest egg required. Every decision in Level Two flows back to that number.',
        },
        {
          title:'The Clock',
          color:'#CC3333',
          body:'The average NBA career is 4.5 years. The window to build the nest egg is narrow. Every year in the league without a plan is compounding that never happened.',
        },
        {
          title:'The Framework',
          color:'#4488CC',
          body:'Minimize what taxes and fees take. Protect the base. Compound what remains. Keep boring, passive, low-cost at the core. In that order, without exception.',
        },
      ];

      const agenda = [
        { num:'02', label:'Career Arc & Tax Reality' },
        { num:'03', label:'Real Estate: The Education' },
        { num:'04', label:'The Pitch Room' },
        { num:'05', label:'Protection First' },
        { num:'06', label:'The Team & The Circle' },
        { num:'07', label:'The Second Chapter' },
      ];

      return (
        <section id="foundation" style={{ padding:'80px 0', background:'#0A0A0A' }}>
          <div className="container">
            <SectionLabel num="01" title="The Foundation" />
            <p style={{ color:'#888', marginBottom:40, maxWidth:640, lineHeight:1.9 }}>
              Smart Money established the rules. Level Two is about applying them to the specific decisions a professional athlete faces. The fundamentals do not change — but the complexity does.
            </p>

            <div className="grid-3" style={{ marginBottom:40 }}>
              {pillars.map(p => (
                <div key={p.title} className="card" style={{ borderTop:`3px solid ${p.color}`, padding:'24px' }}>
                  <div className="bebas" style={{ color:p.color, fontSize:'1.2rem', letterSpacing:'0.05em', marginBottom:12 }}>{p.title}</div>
                  <p style={{ color:'#888', fontSize:'0.82rem', lineHeight:1.8 }}>{p.body}</p>
                </div>
              ))}
            </div>

            <div style={{ borderRadius:14, padding:'28px 32px', background:'linear-gradient(135deg,#1a1200 0%,#0e0e0e 100%)', border:'1px solid #D4A843', marginBottom:40 }}>
              <div className="bebas" style={{ color:'#D4A843', fontSize:'1.2rem', letterSpacing:'0.05em', marginBottom:14 }}>What Changes Now</div>
              <p style={{ color:'#ccc', lineHeight:1.9, fontSize:'0.88rem' }}>
                Having a business manager means the conversation goes deeper. The questions get harder. The stakes get higher. Level Two covers the specific territory a professional athlete has to navigate — the career arc, the tax reality, real estate fundamentals, how to think about investment pitches, protecting what is built, building the right team, and planning the second chapter while the first one is still running.
              </p>
            </div>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))', gap:10 }}>
              {agenda.map(({ num, label }) => (
                <div key={num} className="card" style={{ display:'flex', alignItems:'center', gap:14, padding:'14px 18px', border:'1px solid #1a1a1a' }}>
                  <span className="bebas" style={{ color:'#D4A843', fontSize:'1.8rem', lineHeight:1 }}>{num}</span>
                  <span style={{ color:'#666', fontSize:'0.78rem', lineHeight:1.4 }}>{label}</span>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ═══════════════════════════════════════════════════
    // SECTION 02 — CAREER ARC & TAX REALITY
    // ═══════════════════════════════════════════════════

    function SectionCareerArc() {
      const [activePhase, setActivePhase] = useState(0);

      const phases = [
        {
          name:'Phase 1: The Rookie',
          years:'Years 1–3',
          color:'#4488CC',
          headline:'The money is real. The lifestyle temptation is real. The second contract is not guaranteed.',
          priorities:[
            'Lock in the number before lifestyle locks in — this is the most critical window',
            'Build the emergency fund first, before any investment conversation',
            'The first paycheck will shock — federal, state, city, and agent fees can take 50%+ of gross',
            'Build the team carefully — this is when bad actors are most aggressive',
            'The rookie contract feels permanent. It is not.',
          ],
          risk:'Lifestyle lock-in before the second contract. The spending that looks sustainable on rookie money becomes catastrophic on nothing.',
          taxNote:'First-year players are often unprepared for the effective tax rate. Federal + state + city taxes on NBA income regularly runs 45–55% of gross. Understanding this before the first paycheck is non-negotiable.',
        },
        {
          name:'Phase 2: The Rising',
          years:'Years 3–7',
          color:'#D4A843',
          headline:'Second contract decision. The real money begins. The decisions get bigger.',
          priorities:[
            'Second contract math — the financial gap between a good deal and a great deal compounds for decades',
            'First major investment decisions begin — real estate, business ventures enter the picture',
            'Endorsement income arrives and is taxed differently from playing income',
            'Advisory team should now be fully assembled and accountable',
            'Begin the portfolio intentionally, not reactively',
          ],
          risk:'Premature "I made it" thinking. Second contracts feel like a finish line. They are not.',
          taxNote:'Endorsement and licensing income is typically 1099 income — self-employment. Federal + self-employment tax + state can create a bill that dwarfs what was earned. Entity structure matters here. CPA-led.',
        },
        {
          name:'Phase 3: The Peak',
          years:'Years 7–12',
          color:'#E07020',
          headline:'Maximum earning power. Maximum complexity. Maximum accountability required.',
          priorities:[
            'Portfolio at scale — diversification across asset classes with full oversight',
            'Estate planning fundamentals in place: wills, trusts, beneficiary designations reviewed',
            'Real estate, business equity, and alternative investments need active monitoring',
            'Second chapter planning starts now — building an identity takes years, not months',
            'The team is paid well — make sure they are earning it',
          ],
          risk:'Complexity without oversight. High income attracts complexity. Complexity without the right team creates leakage that is invisible until it is too late.',
          taxNote:'At peak earnings, every dollar of tax efficiency matters most. Deferred compensation structures, retirement vehicles, charitable strategies — all significant. These are CPA-led decisions, not guesses.',
        },
        {
          name:'Phase 4: The Transition',
          years:'Post-Career',
          color:'#44AA66',
          headline:'The income stops. The portfolio takes over. The number set in Phase 1 determines everything.',
          priorities:[
            'Portfolio must now fund the lifestyle — this is exactly why the number mattered',
            'Post-career income sources must be built: media, business, equity, speaking',
            'Spending review is essential — peak-career lifestyle on post-career income is the classic mistake',
            'Identity transition is as important as the financial one — and often harder',
            'The financial team structure changes — evolution is normal, drift is costly',
          ],
          risk:'Spending at peak-career levels on post-career income. The money does not run out in a day — it runs out slowly, then suddenly.',
          taxNote:'Investment income is taxed differently from earned income. Capital gains, qualified dividends, rental income — each has different rates. The transition from W-2 to investment income requires a full CPA strategy reset.',
        },
      ];

      const ph = phases[activePhase];

      return (
        <section id="career-arc" style={{ padding:'80px 0', background:'#080808' }}>
          <div className="container">
            <SectionLabel num="02" title="Career Arc & Tax Reality" />
            <p style={{ color:'#888', marginBottom:40, maxWidth:640, lineHeight:1.9 }}>
              Every phase of an NBA career has different financial priorities, different risks, and a different tax profile. The players who treat all four phases the same are leaving money on the table and setting themselves up to fail. Each phase demands a different strategy — and the cost of getting it wrong compounds just as fast as the returns do.
            </p>

            {/* NBA Contract Reality callout */}
            <div style={{ borderRadius:12, padding:'20px 24px', background:'#0a0a0f', border:'1px solid #4488CC40', marginBottom:32 }}>
              <div className="bebas" style={{ color:'#4488CC', fontSize:'1rem', letterSpacing:'0.06em', marginBottom:14 }}>The NBA Contract Landscape</div>
              <p style={{ color:'#aaa', fontSize:'0.82rem', lineHeight:1.8, marginBottom:16 }}>
                The NBA has more contract structures than any other major sport — and each one carries a completely different financial reality. Not all NBA contracts are the same. Not even close.
              </p>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:8 }}>
                {[
                  { type:'Exhibit 10', color:'#555', detail:'Training camp invite. No guarantee of a roster spot. Includes a small bonus if the player goes to the G League and stays for a set period.' },
                  { type:'Two-Way Contract', color:'#888', detail:'Roughly $560K/year. Player splits time between NBA team and G League affiliate. Limited to 50 NBA games. A legitimate pathway — but a different financial world.' },
                  { type:'10-Day Contract', color:'#4488CC', detail:'Short-term, non-guaranteed beyond the term. Teams can sign a player to two 10-day deals before they must offer a standard contract or release them.' },
                  { type:'Standard Multi-Year', color:'#D4A843', detail:'Where the real money begins. Fully guaranteed. Length and value are negotiated. This is the contract type that changes a career trajectory.' },
                  { type:'Mid-Level Exception', color:'#E07020', detail:'Teams over the cap can use the MLE to sign players. A real deal — but the gap between MLE and max money is where the biggest financial divergence in the NBA lives.' },
                  { type:'Max / Supermax', color:'#44AA66', detail:'25–35% of the salary cap depending on years of service. The supermax can only be offered by the current team. The decisions made on the first standard deal largely determine which of these a player reaches.' },
                ].map(({ type, color, detail }) => (
                  <div key={type} style={{ padding:'12px 14px', background:'#0d0d0d', borderRadius:8, borderTop:`2px solid ${color}` }}>
                    <div className="bebas" style={{ color, fontSize:'0.85rem', letterSpacing:'0.04em', marginBottom:6 }}>{type}</div>
                    <p style={{ color:'#555', fontSize:'0.72rem', lineHeight:1.6, margin:0 }}>{detail}</p>
                  </div>
                ))}
              </div>
            </div>

            {/* Phase tabs */}
            <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:24 }}>
              {phases.map((p, i) => (
                <button key={p.name} onClick={() => setActivePhase(i)} style={{
                  padding:'8px 18px', borderRadius:6, cursor:'pointer',
                  fontWeight:600, fontSize:'0.72rem', textTransform:'uppercase', letterSpacing:'0.04em',
                  background: activePhase===i ? ph.color : '#111',
                  color: activePhase===i ? '#080808' : '#555',
                  border: `1px solid ${activePhase===i ? ph.color : '#222'}`,
                  transition:'all 0.2s',
                }}>
                  {p.years}
                </button>
              ))}
            </div>

            {/* Active phase */}
            <div style={{ borderRadius:14, overflow:'hidden', border:`1px solid ${ph.color}25`, marginBottom:48 }}>
              <div style={{ background:`linear-gradient(135deg,${ph.color}12 0%,#0e0e0e 100%)`, padding:'28px' }}>
                <div style={{ display:'flex', alignItems:'flex-start', gap:14, marginBottom:14 }}>
                  <div style={{ flex:1 }}>
                    <div className="bebas" style={{ color:ph.color, fontSize:'1.5rem', letterSpacing:'0.04em', lineHeight:1, marginBottom:4 }}>{ph.name}</div>
                    <div style={{ color:'#444', fontSize:'0.65rem', textTransform:'uppercase', letterSpacing:'0.12em' }}>{ph.years}</div>
                  </div>
                </div>
                <p style={{ color:'white', fontSize:'0.9rem', fontWeight:600, lineHeight:1.7 }}>{ph.headline}</p>
              </div>
              <div style={{ padding:'24px 28px', background:'#0a0a0a' }}>
                <div className="grid-2">
                  <div>
                    <p style={{ fontSize:'0.62rem', color:'#444', textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:14 }}>Key Priorities</p>
                    {ph.priorities.map((pr, i) => (
                      <div key={i} style={{ display:'flex', gap:10, alignItems:'flex-start', marginBottom:10 }}>
                        <span style={{ color:ph.color, fontSize:'0.75rem', marginTop:3, flexShrink:0 }}>→</span>
                        <p style={{ color:'#999', fontSize:'0.8rem', lineHeight:1.75, margin:0 }}>{pr}</p>
                      </div>
                    ))}
                  </div>
                  <div>
                    <div style={{ borderRadius:10, padding:'16px', background:'#0f0606', border:'1px solid #CC333320', marginBottom:12 }}>
                      <p style={{ fontSize:'0.62rem', color:'#CC3333', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:8 }}>Key Risk</p>
                      <p style={{ color:'#bbb', fontSize:'0.8rem', lineHeight:1.75, margin:0 }}>{ph.risk}</p>
                    </div>
                    <div style={{ borderRadius:10, padding:'16px', background:'#060f08', border:'1px solid #44AA6620' }}>
                      <p style={{ fontSize:'0.62rem', color:'#44AA66', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:8 }}>Tax Reality</p>
                      <p style={{ color:'#bbb', fontSize:'0.8rem', lineHeight:1.75, margin:0 }}>{ph.taxNote}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Jock Tax */}
            <div style={{ marginBottom:24 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.8rem,5vw,3rem)', letterSpacing:'0.04em', marginBottom:8 }}>The Jock Tax</div>
              <p style={{ color:'#888', marginBottom:32, maxWidth:600, lineHeight:1.9 }}>

                            <p style={{ fontSize:'0.62rem', color:'#D4A843', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:8 }}>Start Now</p>
                            <p style={{ color:'#aaa', fontSize:'0.8rem', lineHeight:1.8, margin:0 }}>{c.planNow}</p>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* Planning principles */}
            <div style={{ marginBottom:40 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:24 }}>The Principles</div>
              <div className="grid-2">
                {[
                  { title:'Build the identity before you need it', body:'Brand, relationships, and reputation are built over years. A player who spends the last three seasons of a career quietly building their next chapter has a meaningful head start on the day they announce retirement.' },
                  { title:'The portfolio funds the lifestyle', body:'Post-career should not require income from a new venture to maintain the standard of living. The portfolio built during the playing career carries that weight — which is exactly why the number mattered from day one.' },
                  { title:'Diversify income before you need it', body:'The second chapter is not a single bet. Multiple income streams — some active, some passive — provide the same diversification in income that the portfolio provides in investment.' },
                  { title:'Transition thoughtfully', body:'The athletes who struggle most in retirement made their first major post-career move reactively — a franchise bought because they needed something to do, a media deal accepted because someone called. Plan from strength, not from boredom.' },
                ].map(({ title, body }) => (
                  <div key={title} className="card" style={{ padding:'22px', border:'1px solid #1a1a1a' }}>
                    <div className="bebas" style={{ color:'#D4A843', fontSize:'1rem', letterSpacing:'0.05em', marginBottom:10, lineHeight:1.2 }}>{title}</div>
                    <p style={{ color:'#777', fontSize:'0.8rem', lineHeight:1.8, margin:0 }}>{body}</p>
                  </div>
                ))}
              </div>
            </div>

            {/* The Rule */}
            <div style={{ borderRadius:14, padding:'36px', background:'linear-gradient(135deg,#1a1200 0%,#0e0e0e 100%)', border:'1px solid #D4A843', textAlign:'center' }}>
              <p style={{ color:'#555', fontSize:'0.65rem', textTransform:'uppercase', letterSpacing:'0.15em', marginBottom:16 }}>The Question That Drives Level Two</p>
              <p className="bebas" style={{ color:'#D4A843', fontSize:'clamp(1rem,3vw,1.5rem)', letterSpacing:'0.04em', lineHeight:1.5, margin:0 }}>
                "If the career ended tomorrow, what would you do on Monday?"
              </p>
              <p style={{ color:'#555', fontSize:'0.8rem', lineHeight:1.8, marginTop:16, maxWidth:520, margin:'16px auto 0' }}>
                If the answer is clear, the second chapter is already underway. If it is not, that is what we work on today — not after the last game.
              </p>
            </div>
          </div>
        </section>
      );
    }
