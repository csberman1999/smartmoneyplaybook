<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Money | Level Four — Alternative Investments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="/vendor/react.min.js" crossorigin></script>
  <script src="/vendor/react-dom.min.js" crossorigin></script>
  <script src="/vendor/prop-types.min.js" crossorigin></script>
  <script src="/vendor/recharts.js" crossorigin></script>
  <script src="/vendor/babel.min.js"></script>
  <script>
  (function() {
    Babel.registerPreset("react", function() {
      return { plugins: [
        [Babel.availablePlugins["transform-react-jsx"], { runtime: "classic" }],
        Babel.availablePlugins["transform-react-display-name"]
      ]};
    });
  })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #080808; color: #E8E8E8; font-family: 'Open Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4A843; }
    .bebas { font-family: 'Bebas Neue', cursive; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 640px) { .container { padding: 0 24px; } }
    .card { background: #111111; border-radius: 12px; border: 1px solid #1e1e1e; padding: 20px; }
    .section-heading { font-family: 'Bebas Neue', cursive; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: 0.04em; line-height: 1; color: white; text-transform: uppercase; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
    button { font-family: 'Open Sans', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    function CourtDivider() {
      return (
        <div style={{ position:'relative', height:48, overflow:'hidden', display:'flex', alignItems:'center' }}>
          <svg viewBox="0 0 800 48" style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.06 }}>
            <line x1="400" y1="0" x2="400" y2="48" stroke="#D4A843" strokeWidth="2"/>
            <circle cx="400" cy="24" r="20" stroke="#D4A843" strokeWidth="2" fill="none"/>
            <path d="M 150 0 Q 200 24 150 48" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <path d="M 650 0 Q 600 24 650 48" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <rect x="120" y="8" width="70" height="32" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <rect x="610" y="8" width="70" height="32" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
          </svg>
          <div style={{ width:'100%', height:1, background:'linear-gradient(90deg,transparent,#D4A843 20%,#D4A843 80%,transparent)' }}/>
        </div>
      );
    }

    function SectionLabel({ num, title }) {
      return (
        <div style={{ marginBottom:40 }}>
          <p className="bebas" style={{ color:'#D4A843', letterSpacing:'0.1em', fontSize:'1.1rem', marginBottom:8 }}>Section {num}</p>
          <h2 className="section-heading">{title}</h2>
          <div style={{ width:64, height:3, background:'#D4A843', borderRadius:2, marginTop:14 }}/>
        </div>
      );
    }

    function ComplianceNote({ children }) {
      return (
        <div style={{ borderLeft:'4px solid #D4A843', background:'#0D0D0D', padding:'14px 18px', borderRadius:'0 8px 8px 0', fontSize:'0.78rem', color:'#777', lineHeight:1.7, marginTop:32 }}>
          <strong style={{ color:'#D4A843' }}>Education note: </strong>{children}
        </div>
      );
    }

    const SECTIONS = [
      { id:'overview',        label:'Overview' },
      { id:'private-equity',  label:'Private Equity' },
      { id:'venture-capital', label:'Venture Capital' },
      { id:'hedge-funds',     label:'Hedge Funds' },
      { id:'real-assets',     label:'Real Assets' },
      { id:'private-credit',  label:'Private Credit' },
      { id:'crypto',          label:'Digital Assets' },
    ];

    function Nav() {
      const [active, setActive] = useState('overview');
      useEffect(() => {
        const obs = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }); }, { threshold: 0.3 });
        SECTIONS.forEach(({ id }) => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);
      const scrollTo = id => document.getElementById(id)?.scrollIntoView({ behavior:'smooth' });
      return (
        <nav style={{ position:'sticky', top:0, zIndex:50, width:'100%', background:'rgba(8,8,8,0.95)', backdropFilter:'blur(12px)', borderBottom:'1px solid #222' }}>
          <div className="container">
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', height:56, gap:8 }}>
              <div style={{ display:'flex', flexDirection:'column', lineHeight:1 }}>
                <span className="bebas" style={{ color:'#D4A843', letterSpacing:'0.1em', fontSize:'1.2rem' }}>SMART MONEY</span>
                <span style={{ color:'#444', fontSize:'0.55rem', textTransform:'uppercase', letterSpacing:'0.15em', marginTop:2 }}>Level Four</span>
              </div>
              <div style={{ display:'flex', gap:2, flexWrap:'wrap', justifyContent:'flex-end' }}>
                {SECTIONS.map(({ id, label }) => (
                  <button key={id} onClick={() => scrollTo(id)} style={{ padding:'4px 10px', fontSize:'0.63rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em', color: active===id ? '#D4A843' : '#555', background:'none', border:'none', borderBottom: active===id ? '2px solid #D4A843' : '2px solid transparent', cursor:'pointer', whiteSpace:'nowrap' }}>{label}</button>
                ))}
              </div>
            </div>
          </div>
        </nav>
      );
    }

    function Hero() {
      const [vis, setVis] = useState(false);
      useEffect(() => { setTimeout(() => setVis(true), 100); }, []);
      return (
        <section style={{ minHeight:'60vh', display:'flex', flexDirection:'column', justifyContent:'center', padding:'80px 0 60px', background:'radial-gradient(ellipse at 50% 0%, #0d1a0d 0%, #080808 65%)' }}>
          <div className="container">
            <div style={{ opacity:vis?1:0, transform:vis?'translateY(0)':'translateY(24px)', transition:'all 0.8s ease' }}>
              <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
                <div style={{ width:40, height:2, background:'#D4A843' }}/>
                <span className="bebas" style={{ color:'#D4A843', letterSpacing:'0.2em', fontSize:'0.9rem' }}>LEVEL FOUR</span>
              </div>
              <h1 className="bebas" style={{ fontSize:'clamp(3rem,12vw,7rem)', letterSpacing:'0.04em', lineHeight:0.9, color:'white', marginBottom:24 }}>Alternative<br/>Investments<br/>&amp; Private<br/>Markets</h1>
              <p style={{ color:'#888', fontSize:'clamp(0.9rem,2vw,1.1rem)', maxWidth:540, lineHeight:1.8, marginBottom:40 }}>
                The asset classes pitched to athletes most often are the ones explained least clearly. Private equity, venture, hedge funds, real assets, private credit, and crypto — each has a different risk profile, liquidity structure, and fee model. Understanding them is the only defense against being sold something you don't understand.
              </p>
              <div style={{ display:'flex', flexWrap:'wrap', gap:24 }}>
                {[{ num:'7–12 yrs', label:'Typical PE fund lock-up' }, { num:'2 & 20', label:'Standard hedge fund fee' }, { num:'90%+', label:'Startups that fail to return capital' }].map(({ num, label }) => (
                  <div key={label}>
                    <div className="bebas" style={{ color:'#D4A843', fontSize:'2rem', letterSpacing:'0.04em', lineHeight:1 }}>{num}</div>
                    <div style={{ color:'#444', fontSize:'0.7rem', textTransform:'uppercase', letterSpacing:'0.08em', marginTop:4 }}>{label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Section1() {
      const assetClasses = [
        { name:'Public Equities', liquid:'Daily', return:'7–10%', risk:'Medium', access:'Anyone', color:'#4488CC' },
        { name:'Private Equity', liquid:'7–12 yrs', return:'12–18%*', risk:'Medium-High', access:'Accredited/QP', color:'#D4A843' },
        { name:'Venture Capital', liquid:'10–15 yrs', return:'High / Binary', risk:'Very High', access:'Accredited/QP', color:'#44AA66' },
        { name:'Hedge Funds', liquid:'Quarterly/Annual', return:'Varies widely', risk:'Varies', access:'Accredited/QP', color:'#9966CC' },
        { name:'Real Assets', liquid:'Low–Medium', return:'6–12%*', risk:'Low–Medium', access:'Accredited', color:'#E07020' },
        { name:'Private Credit', liquid:'3–7 yrs', return:'8–14%*', risk:'Medium', access:'Accredited/QP', color:'#4488CC' },
        { name:'Crypto / Digital', liquid:'Daily (self-custody)', return:'Highly volatile', risk:'Very High', access:'Anyone', color:'#CC3333' },
      ];
      return (
        <section id="overview" style={{ padding:'80px 0' }}>
          <div className="container">
            <SectionLabel num="01" title="The Alternatives Landscape" />
            <p style={{ color:'#888', marginBottom:40, maxWidth:640, lineHeight:1.9 }}>
              "Alternatives" is the catch-all for any investment outside of publicly traded stocks and bonds. They share two common features: limited liquidity and limited transparency. In exchange, they can offer returns and diversification unavailable in public markets — but only if accessed properly and sized appropriately.
            </p>
            <div style={{ marginBottom:48 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:16 }}>Asset Class Comparison</div>
              <div style={{ borderRadius:12, overflow:'hidden', border:'1px solid #1a1a1a' }}>
                <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr', gap:0, padding:'10px 16px', background:'#111', borderBottom:'1px solid #1a1a1a' }}>
                  {['Asset Class','Liquidity','Target Return','Risk','Access'].map(h => <span key={h} style={{ color:'#444', fontSize:'0.62rem', textTransform:'uppercase', letterSpacing:'0.08em' }}>{h}</span>)}
                </div>
                {assetClasses.map((a, i) => (
                  <div key={a.name} style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr', gap:0, padding:'12px 16px', background: i%2===0 ? '#0d0d0d' : '#0a0a0a', borderBottom: i<assetClasses.length-1 ? '1px solid #111' : 'none', alignItems:'center' }}>
                    <span className="bebas" style={{ color:a.color, fontSize:'0.9rem', letterSpacing:'0.04em' }}>{a.name}</span>
                    <span style={{ color:'#666', fontSize:'0.75rem' }}>{a.liquid}</span>
                    <span style={{ color:'#888', fontSize:'0.75rem' }}>{a.return}</span>
                    <span style={{ color:'#666', fontSize:'0.75rem' }}>{a.risk}</span>
                    <span style={{ color:'#555', fontSize:'0.72rem' }}>{a.access}</span>
                  </div>
                ))}
              </div>
              <p style={{ color:'#333', fontSize:'0.68rem', marginTop:8 }}>* Historical averages. Past performance does not guarantee future results. Returns shown are illustrative benchmarks.</p>
            </div>
            <div className="grid-2">
              <div className="card" style={{ borderLeft:'3px solid #44AA66', padding:'22px' }}>
                <div className="bebas" style={{ color:'#44AA66', fontSize:'1rem', letterSpacing:'0.04em', marginBottom:10 }}>The Illiquidity Premium</div>
                <p style={{ color:'#777', fontSize:'0.82rem', lineHeight:1.8, margin:0 }}>Investors who accept locked-up capital earn a premium for that sacrifice. The illiquidity premium — the extra return offered by private markets over their public equivalents — is the core rationale for alternatives. But it only materializes if the investor can genuinely afford to not touch the capital for the full term.</p>
              </div>
              <div className="card" style={{ borderLeft:'3px solid #CC3333', padding:'22px' }}>
                <div className="bebas" style={{ color:'#CC3333', fontSize:'1rem', letterSpacing:'0.04em', marginBottom:10 }}>The Access Problem</div>
                <p style={{ color:'#777', fontSize:'0.82rem', lineHeight:1.8, margin:0 }}>The best private equity and venture funds are not open to new investors. Top-tier managers are oversubscribed — they don't need capital. What athletes are typically offered is not what institutional investors access. Demand to know where a fund ranks within its peer group before committing.</p>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Section2() {
      const [open, setOpen] = useState(null);
      const terms = [
        { term:'General Partner (GP)', def:'The fund manager. Makes all investment decisions. Earns management fees and carried interest. Has fiduciary duty to limited partners.' },
        { term:'Limited Partner (LP)', def:'The investor. Commits capital to the fund. Has no say in investment decisions. Liability limited to committed capital.' },
        { term:'Management Fee', def:'Annual fee paid to the GP regardless of performance. Typically 1.5–2% of committed capital. Paid even when the fund is losing money.' },
        { term:'Carried Interest ("Carry")', def:'The GP\'s share of profits above the hurdle rate. Typically 20%. If the fund returns $200M on $100M invested, the GP earns 20% of the $100M gain = $20M. The primary incentive for the GP.' },
        { term:'Hurdle Rate', def:'The minimum annual return the fund must deliver before the GP earns carry. Typically 8%. Below this, investors receive all returns. Above this, carry kicks in.' },
        { term:'The J-Curve', def:'Early in a fund\'s life, returns are negative — fees are charged while investments haven\'t yet matured. Returns improve as companies grow and are exited. The J-shaped return profile is normal and expected.' },
        { term:'Vintage Year', def:'The year a fund makes its first investment. Vintage year matters: funds raised before a recession often outperform those raised at peak valuations. Diversifying across vintage years is standard institutional practice.' },
        { term:'Capital Call', def:'When the fund is ready to invest, it "calls" committed capital from LPs — typically with 10 days\' notice. Missing a capital call can result in severe penalties or loss of the LP interest.' },
      ];
      return (
        <section id="private-equity" style={{ padding:'80px 0', background:'#080808' }}>
          <div className="container">
            <SectionLabel num="02" title="Private Equity" />
            <p style={{ color:'#888', marginBottom:40, maxWidth:640, lineHeight:1.9 }}>
              Private equity funds raise capital from investors (limited partners), use it to acquire private companies, improve them operationally, and sell them for a profit — typically over a 7–12 year period. The returns can be significant. So can the lock-up, the fees, and the minimum investment.
            </p>
            <div style={{ marginBottom:48 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:8 }}>How a PE Fund Works</div>
              <div style={{ display:'flex', flexDirection:'column', gap:0, borderRadius:12, overflow:'hidden', border:'1px solid #1a1a1a', marginBottom:24 }}>
                {[{ phase:'Fundraising', yr:'Year 0–1', desc:'GP raises capital commitments from LPs. Minimum investments typically $1M–$5M+. Capital is committed but not yet deployed.' }, { phase:'Investment Period', yr:'Year 1–5', desc:'GP identifies, underwrites, and acquires portfolio companies. Capital is called as deals are made. Fees charged on committed capital.' }, { phase:'Value Creation', yr:'Year 3–8', desc:'GP works with portfolio companies to improve operations, revenue, and margins. Management teams are often replaced or upgraded.' }, { phase:'Exit & Distribution', yr:'Year 5–12', desc:'Companies are sold (to strategic buyers, other PE firms, or via IPO). Proceeds distributed to LPs net of fees and carry.' }].map(({ phase, yr, desc }, i) => (
                  <div key={phase} style={{ display:'grid', gridTemplateColumns:'140px 80px 1fr', gap:16, padding:'16px 20px', background: i%2===0 ? '#0d0d0d' : '#0a0a0a', borderBottom: i<3 ? '1px solid #111' : 'none', alignItems:'flex-start' }}>
                    <span className="bebas" style={{ color:'#D4A843', fontSize:'0.9rem', letterSpacing:'0.04em' }}>{phase}</span>
                    <span style={{ color:'#555', fontSize:'0.72rem' }}>{yr}</span>
                    <span style={{ color:'#777', fontSize:'0.78rem', lineHeight:1.6 }}>{desc}</span>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ marginBottom:40 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:8 }}>Key Terms to Know</div>
              <p style={{ color:'#888', marginBottom:20, fontSize:'0.85rem', lineHeight:1.8 }}>Every PE pitch will use these terms. Understanding them is the difference between knowing what you're signing and trusting someone to explain it later.</p>
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {terms.map((t, i) => (
                  <div key={t.term} style={{ borderRadius:8, overflow:'hidden', cursor:'pointer', border:`1px solid ${open===i ? '#D4A84340' : '#1a1a1a'}` }}>
                    <div onClick={() => setOpen(open===i ? null : i)} style={{ padding:'12px 18px', display:'flex', justifyContent:'space-between', alignItems:'center', background: open===i ? '#D4A84308' : '#0d0d0d' }}>
                      <span className="bebas" style={{ color: open===i ? '#D4A843' : '#aaa', fontSize:'0.9rem', letterSpacing:'0.04em' }}>{t.term}</span>
                      <span style={{ color:'#444', fontSize:'0.7rem' }}>{open===i ? '▲' : '▼'}</span>
                    </div>
                    {open===i && <div style={{ padding:'12px 18px 16px', background:'#0a0a0a' }}><p style={{ color:'#777', fontSize:'0.82rem', lineHeight:1.8, margin:0 }}>{t.def}</p></div>}
                  </div>
                ))}
              </div>
            </div>
            <div className="card" style={{ background:'linear-gradient(135deg,#1a1200,#111)', border:'1px solid #D4A843', padding:'24px' }}>
              <div className="bebas" style={{ color:'#D4A843', fontSize:'1rem', letterSpacing:'0.08em', marginBottom:10 }}>The Question to Ask Before Any PE Commitment</div>
              <p style={{ color:'#aaa', fontSize:'0.85rem', lineHeight:1.8, margin:0 }}>What is this fund's track record across its prior vintages, net of all fees? Top-quartile PE funds genuinely outperform public markets. Bottom-quartile funds underperform them — and charge fees for the privilege. Request audited performance data and compare it to the Cambridge Associates PE benchmark for the same vintage years.</p>
            </div>
            <ComplianceNote>Private equity investments are illiquid, unregistered securities. Minimums are typically $250K–$5M+. Accredited investor or qualified purchaser status required. Past fund performance does not guarantee future results.</ComplianceNote>
          </div>
        </section>
      );
    }

    function Section3() {
      const stages = [
        { stage:'Pre-Seed / Seed', check:'$250K–$2M', valuation:'$1M–$10M', who:'Founders + friends/family + angels', survival:'~10% reach Series A', color:'#44AA66' },
        { stage:'Series A', check:'$2M–$15M', valuation:'$10M–$50M', who:'Early-stage VC funds', survival:'~30% reach Series B', color:'#D4A843' },
        { stage:'Series B', check:'$15M–$50M', valuation:'$50M–$200M', who:'Growth-stage VC funds', survival:'~50% reach Series C', color:'#4488CC' },
        { stage:'Series C+', check:'$50M–$300M+', valuation:'$200M–$1B+', who:'Late-stage VC, crossover funds', survival:'~30% reach IPO/acquisition', color:'#9966CC' },
        { stage:'Exit (IPO / M&A)', check:'—', valuation:'Market-determined', who:'Public investors / strategic buyer', survival:'Liquidity event for all prior investors', color:'#E07020' },
      ];
      return (
        <section id="venture-capital" style={{ padding:'80px 0' }}>
          <div className="container">
            <SectionLabel num="03" title="Venture Capital" />
            <p style={{ color:'#888', marginBottom:40, maxWidth:640, lineHeight:1.9 }}>
              Venture capital funds early-stage companies in exchange for equity. The return profile is binary: most investments return nothing, a few return everything. The asset class works for institutional funds deploying across hundreds of companies. It is significantly riskier for an individual investor making three bets with $500K each.
            </p>
            <div style={{ marginBottom:48 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:16 }}>The Funding Stages</div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {stages.map(s => (
                  <div key={s.stage} className="card" style={{ padding:'20px 24px', borderLeft:`3px solid ${s.color}` }}>
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, marginBottom:10 }}>
                      <div><div className="bebas" style={{ color:s.color, fontSize:'1rem', letterSpacing:'0.04em' }}>{s.stage}</div></div>
                      <div><div style={{ color:'#444', fontSize:'0.62rem', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:2 }}>Check Size</div><div style={{ color:'#aaa', fontSize:'0.78rem' }}>{s.check}</div></div>
                      <div><div style={{ color:'#444', fontSize:'0.62rem', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:2 }}>Valuation Range</div><div style={{ color:'#aaa', fontSize:'0.78rem' }}>{s.valuation}</div></div>
                    </div>
                    <div style={{ display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:8 }}>
                      <span style={{ color:'#555', fontSize:'0.72rem' }}>{s.who}</span>
                      <span style={{ color: s.color, fontSize:'0.7rem', fontWeight:600 }}>{s.survival}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ marginBottom:48 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:16 }}>What Athletes Are Actually Offered</div>
              <div className="grid-2">
                {[{ title:'Direct Investment (Angel)', color:'#D4A843', body:'Writing a check directly into a startup. You own equity (usually common stock or a SAFE). No intermediary. High risk, high potential return, zero liquidity until exit. Most athlete deals are structured this way.' }, { title:'VC Fund LP', color:'#4488CC', body:'Investing into a fund that deploys capital across many startups. More diversification than a single bet. Less control, longer lock-up. Minimum typically $250K–$1M. Access to top-tier funds is difficult — most athletes are offered mid-tier or emerging managers.' }, { title:'SPV (Special Purpose Vehicle)', color:'#44AA66', body:'A one-company fund created to allow a specific investment. Investors pool capital to participate in a single deal they otherwise couldn\'t access individually. Common in athlete circles. Review the fee structure carefully — SPVs often layer additional fees on top of the underlying deal.' }, { title:'"Equity for Endorsement"', color:'#CC3333', body:'The company offers equity instead of (or in addition to) a cash endorsement fee. The equity is almost always common stock. Common stock is last in line in any exit. Understand the full cap table and preference stack before treating this as a meaningful asset.' }].map(({ title, color, body }) => (
                  <div key={title} className="card" style={{ padding:'22px', borderTop:`3px solid ${color}` }}>
                    <div className="bebas" style={{ color, fontSize:'1rem', letterSpacing:'0.04em', marginBottom:10 }}>{title}</div>
                    <p style={{ color:'#777', fontSize:'0.82rem', lineHeight:1.8, margin:0 }}>{body}</p>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ borderRadius:12, padding:'24px', background:'#0f0606', border:'1px solid #CC333330', marginBottom:32 }}>
              <div style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
                <span style={{ color:'#CC3333', fontSize:'1.4rem', lineHeight:1, flexShrink:0 }}>⚠</span>
                <div>
                  <div className="bebas" style={{ color:'#CC3333', fontSize:'1rem', letterSpacing:'0.06em', marginBottom:8 }}>The Portfolio Math Problem</div>
                  <p style={{ color:'#aaa', fontSize:'0.82rem', lineHeight:1.8, margin:0 }}>
                    Venture capital works as a portfolio strategy. A top VC fund makes 30–50 bets knowing most will fail, counting on 1–2 to return the entire fund. An athlete making 3–5 individual startup investments does not have that coverage. The math that works for an institutional fund does not work at the individual level. If the position is not sized as money one can afford to lose entirely, it's too large.
                  </p>
                </div>
              </div>
            </div>
