<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Money | Level Three — Tax & Wealth Structuring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="/vendor/react.min.js" crossorigin></script>
  <script src="/vendor/react-dom.min.js" crossorigin></script>
  <script src="/vendor/prop-types.min.js" crossorigin></script>

  <script>
  (function() {
    Babel.registerPreset("react", function() {
      return { plugins: [
        [Babel.availablePlugins["transform-react-jsx"], { runtime: "classic" }],

  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #080808; color: #E8E8E8; font-family: 'Open Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4A843; }
    .bebas { font-family: 'Bebas Neue', cursive; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 640px) { .container { padding: 0 24px; } }
    .card { background: #111111; border-radius: 12px; border: 1px solid #1e1e1e; padding: 20px; }
    .section-heading { font-family: 'Bebas Neue', cursive; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: 0.04em; line-height: 1; color: white; text-transform: uppercase; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
    button { font-family: 'Open Sans', sans-serif; }

    /* Responsive nav: desktop unchanged; phones get a compact scrollable strip */
    .nav-row { display:flex; align-items:center; justify-content:space-between; min-height:56px; gap:8px; }
    .nav-links { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .nav-links.tight { gap:2px; }
    @media (max-width: 820px) {
      .nav-row { flex-direction:column; align-items:stretch; gap:0; min-height:0; padding-top:8px; }
      .nav-links {
        flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start;
        margin-top:6px; padding-bottom:8px;
        -webkit-overflow-scrolling:touch; scrollbar-width:none;
      }
      .nav-links::-webkit-scrollbar { display:none; }
      .nav-links > button { flex:0 0 auto; }
    }
  </style>
  <!-- Vercel Web Analytics: counts opens of this level. Aggregate only, no identity. -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    function CourtDivider() {
      return (
        <div style={{ position:'relative', height:48, overflow:'hidden', display:'flex', alignItems:'center' }}>
          <svg viewBox="0 0 800 48" style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.06 }}>
            <line x1="400" y1="0" x2="400" y2="48" stroke="#D4A843" strokeWidth="2"/>
            <circle cx="400" cy="24" r="20" stroke="#D4A843" strokeWidth="2" fill="none"/>
            <path d="M 150 0 Q 200 24 150 48" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <path d="M 650 0 Q 600 24 650 48" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <rect x="120" y="8" width="70" height="32" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
            <rect x="610" y="8" width="70" height="32" stroke="#D4A843" strokeWidth="1.5" fill="none"/>
          </svg>
          <div style={{ width:'100%', height:1, background:'linear-gradient(90deg,transparent,#D4A843 20%,#D4A843 80%,transparent)' }}/>
        </div>
      );
    }

    function SectionLabel({ num, title }) {
      return (
        <div style={{ marginBottom:40 }}>
          <p className="bebas" style={{ color:'#D4A843', letterSpacing:'0.1em', fontSize:'1.1rem', marginBottom:8 }}>Section {num}</p>
          <h2 className="section-heading">{title}</h2>
          <div style={{ width:64, height:3, background:'#D4A843', borderRadius:2, marginTop:14 }}/>
        </div>
      );
    }

    function ComplianceNote({ children }) {
      return (
        <div style={{ borderLeft:'4px solid #D4A843', background:'#0D0D0D', padding:'14px 18px', borderRadius:'0 8px 8px 0', fontSize:'0.78rem', color:'#777', lineHeight:1.7, marginTop:32 }}>
          <strong style={{ color:'#D4A843' }}>Education note: </strong>{children}
        </div>
      );
    }

    const SECTIONS = [
      { id:'tax-reality',   label:'The Tax Reality' },
      { id:'entities',      label:'Business Entities' },
      { id:'deferred-comp', label:'Deferred Comp' },
      { id:'trusts',        label:'Trust Structures' },
      { id:'tax-accounts',  label:'Tax-Adv. Accounts' },
      { id:'estate',        label:'Estate Planning' },
      { id:'tax-team',      label:'Your Tax Team' },
    ];

    function Nav() {
      const [active, setActive] = useState('tax-reality');
      useEffect(() => {
        const obs = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }); }, { threshold: 0.3 });
        SECTIONS.forEach(({ id }) => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);
      const scrollTo = id => document.getElementById(id)?.scrollIntoView({ behavior:'smooth' });
      return (
        <nav style={{ position:'sticky', top:0, zIndex:50, width:'100%', background:'rgba(8,8,8,0.95)', backdropFilter:'blur(12px)', borderBottom:'1px solid #222' }}>
          <div className="container">
            <div className="nav-row">
              <div style={{ display:'flex', flexDirection:'column', lineHeight:1 }}>
                <span className="bebas" style={{ color:'#D4A843', letterSpacing:'0.1em', fontSize:'1.2rem' }}>SMART MONEY</span>
                <span style={{ color:'#444', fontSize:'0.55rem', textTransform:'uppercase', letterSpacing:'0.15em', marginTop:2 }}>Level Three</span>
              </div>
              <div className="nav-links tight">
                {SECTIONS.map(({ id, label }) => (
                  <button key={id} onClick={() => scrollTo(id)} style={{ padding:'4px 10px', fontSize:'0.63rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em', color: active===id ? '#D4A843' : '#555', background:'none', border:'none', borderBottom: active===id ? '2px solid #D4A843' : '2px solid transparent', cursor:'pointer', whiteSpace:'nowrap' }}>{label}</button>
                ))}
              </div>
            </div>
          </div>
        </nav>
      );
    }

    function Hero() {
      const [vis, setVis] = useState(false);
      useEffect(() => { setTimeout(() => setVis(true), 100); }, []);
      return (
        <section style={{ minHeight:'60vh', display:'flex', flexDirection:'column', justifyContent:'center', padding:'80px 0 60px', background:'radial-gradient(ellipse at 50% 0%, #1a1200 0%, #080808 65%)' }}>
          <div className="container">
            <div style={{ opacity:vis?1:0, transform:vis?'translateY(0)':'translateY(24px)', transition:'all 0.8s ease' }}>
              <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
                <div style={{ width:40, height:2, background:'#D4A843' }}/>
                <span className="bebas" style={{ color:'#D4A843', letterSpacing:'0.2em', fontSize:'0.9rem' }}>LEVEL THREE</span>
              </div>
              <h1 className="bebas" style={{ fontSize:'clamp(3rem,12vw,7rem)', letterSpacing:'0.04em', lineHeight:0.9, color:'white', marginBottom:24 }}>Tax &<br/>Wealth<br/>Structuring</h1>
              <p style={{ color:'#888', fontSize:'clamp(0.9rem,2vw,1.1rem)', maxWidth:520, lineHeight:1.8, marginBottom:40 }}>
                Earning it is only half the game. How wealth is structured, timed, and protected determines how much of it survives — for you and for the people who come after you.
              </p>
              <div style={{ display:'flex', flexWrap:'wrap', gap:24 }}>
                {[{ num:'37%', label:'Top federal marginal rate' }, { num:'50%+', label:'Combined top federal + state rate' }, { num:'2026', label:'Estate exemption sunset' }].map(({ num, label }) => (
                  <div key={label}>
                    <div className="bebas" style={{ color:'#D4A843', fontSize:'2rem', letterSpacing:'0.04em', lineHeight:1 }}>{num}</div>
                    <div style={{ color:'#444', fontSize:'0.7rem', textTransform:'uppercase', letterSpacing:'0.08em', marginTop:4 }}>{label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Section1() {
      const [income, setIncome] = useState(5);
      const brackets = [
        { min:0, max:11600, rate:0.10 }, { min:11600, max:47150, rate:0.12 },
        { min:47150, max:100525, rate:0.22 }, { min:100525, max:191950, rate:0.24 },
        { min:191950, max:243725, rate:0.32 }, { min:243725, max:609350, rate:0.35 },
        { min:609350, max:Infinity, rate:0.37 },
      ];
      const calcTax = inc => { let tax = 0; for (const b of brackets) { if (inc <= b.min) break; tax += (Math.min(inc, b.max) - b.min) * b.rate; } return tax; };
      const gross = income * 1e6;
      const fed = calcTax(gross);
      const eff = (fed / gross * 100).toFixed(1);
      const marg = gross > 609350 ? 37 : gross > 243725 ? 35 : 32;
      const fmt = n => n >= 1e6 ? `$${(n/1e6).toFixed(2)}M` : `$${(n/1000).toFixed(0)}K`;
      return (
        <section id="tax-reality" style={{ padding:'80px 0' }}>
          <div className="container">
            <SectionLabel num="01" title="The Tax Reality" />
            <p style={{ color:'#888', marginBottom:40, maxWidth:640, lineHeight:1.9 }}>
              A professional athlete's income is concentrated, short-lived, and earned in multiple states. Understanding how taxes actually work is the first step to not overpaying them.
            </p>
            <div style={{ marginBottom:48 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:8 }}>Marginal vs. Effective Rate</div>
              <p style={{ color:'#888', marginBottom:24, fontSize:'0.85rem', lineHeight:1.8 }}>When people say a player "pays 37% in taxes," they're wrong. You pay 37% only on income above $609,350. Every dollar below that is taxed at a lower rate. The effective rate is what you actually pay — and it's always lower than the marginal rate.</p>
              <div className="card" style={{ marginBottom:24, padding:'32px' }}>
                <div style={{ marginBottom:20 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
                    <span style={{ color:'#888', fontSize:'0.8rem' }}>Annual Income</span>
                    <span className="bebas" style={{ color:'#D4A843', fontSize:'1.1rem' }}>${income}M</span>
                  </div>
                  <input type="range" min={1} max={50} step={0.5} value={income} onChange={e => setIncome(Number(e.target.value))} style={{ width:'100%', accentColor:'#D4A843' }} />
                </div>
                <div className="grid-3" style={{ marginBottom:16 }}>
                  {[{ val:`${marg}%`, label:'Marginal Rate', color:'#D4A843' }, { val:`${eff}%`, label:'Effective Rate', color:'#44AA66' }, { val:fmt(fed), label:'Federal Tax (est.)', color:'#CC3333' }].map(({ val, label, color }) => (
                    <div key={label} style={{ textAlign:'center', padding:'16px', background:'#0d0d0d', borderRadius:8, border:'1px solid #1a1a1a' }}>
                      <div className="bebas" style={{ color, fontSize:'2rem', letterSpacing:'0.04em' }}>{val}</div>
                      <div style={{ color:'#555', fontSize:'0.65rem', textTransform:'uppercase', letterSpacing:'0.08em', marginTop:4 }}>{label}</div>
                    </div>
                  ))}
                </div>
                <p style={{ color:'#444', fontSize:'0.72rem', lineHeight:1.7 }}>Federal income tax only. Excludes state, FICA, and Medicare. Single filer, 2024 brackets. Illustration only.</p>
              </div>
            </div>
            <div style={{ marginBottom:48 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:8 }}>The Jock Tax</div>
              <p style={{ color:'#888', marginBottom:24, fontSize:'0.85rem', lineHeight:1.8 }}>Most professional athletes pay taxes in multiple states — every state where they play an away game. The allocation is based on duty days: days worked in each state as a proportion of total working days.</p>
              <div className="grid-2" style={{ marginBottom:20 }}>
                <div className="card" style={{ padding:'24px' }}>
                  <div className="bebas" style={{ color:'#D4A843', fontSize:'1.1rem', letterSpacing:'0.04em', marginBottom:14 }}>How It's Calculated</div>
                  {[{ step:'01', text:'Count total duty days (practice + games + travel in some states)' }, { step:'02', text:'Count duty days spent in each away state' }, { step:'03', text:'Divide: state days ÷ total days = % of income allocated there' }, { step:'04', text:'Pay that state\'s income tax rate on that % of income' }].map(({ step, text }) => (
                    <div key={step} style={{ display:'flex', gap:12, marginBottom:12, alignItems:'flex-start' }}>
                      <span className="bebas" style={{ color:'#D4A843', fontSize:'1.1rem', flexShrink:0 }}>{step}</span>
                      <p style={{ color:'#777', fontSize:'0.78rem', lineHeight:1.6, margin:0 }}>{text}</p>
                    </div>
                  ))}
                </div>
                <div className="card" style={{ padding:'24px' }}>
                  <div className="bebas" style={{ color:'#D4A843', fontSize:'1.1rem', letterSpacing:'0.04em', marginBottom:14 }}>States to Watch</div>
                  {[{ state:'California', rate:'13.3%', note:'Highest state income tax. Home to multiple teams.' }, { state:'New York', rate:'10.9%', note:'State + NYC city tax can push combined rate above 14%.' }, { state:'New Jersey', rate:'10.75%', note:'Giants and Jets both play here.' }, { state:'Texas', rate:'0%', note:'No state income tax. Major NFL and NBA presence.' }, { state:'Florida', rate:'0%', note:'No state income tax. Growing athlete residency destination.' }].map(({ state, rate, note }) => (
                    <div key={state} style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', padding:'8px 0', borderBottom:'1px solid #161616' }}>
                      <div><div style={{ color:'white', fontSize:'0.8rem', fontWeight:600 }}>{state}</div><div style={{ color:'#555', fontSize:'0.7rem', lineHeight:1.5 }}>{note}</div></div>
                      <span className="bebas" style={{ color: rate==='0%' ? '#44AA66' : '#CC3333', fontSize:'1rem', flexShrink:0, marginLeft:12 }}>{rate}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="card" style={{ background:'linear-gradient(135deg,#0a0a1a,#0e0e0e)', border:'1px solid #4488CC40', padding:'24px' }}>
                <div className="bebas" style={{ color:'#4488CC', fontSize:'1rem', letterSpacing:'0.08em', marginBottom:8 }}>Residency Strategy</div>
                <p style={{ color:'#aaa', fontSize:'0.85rem', lineHeight:1.8, margin:0 }}>Where a player establishes legal domicile matters enormously. Living in Florida or Texas eliminates state income tax on base salary. But residency must be genuine — states audit aggressively. Days in state, driver's license, voter registration, and primary home are all factors. A CPA specializing in athlete taxation should be involved before any residency change.</p>
              </div>
            </div>
            {/* SALT / Tax Bite Comparison */}
            <div style={{ marginTop:40, marginBottom:32 }}>
              <div className="bebas" style={{ color:'white', fontSize:'clamp(1.5rem,4vw,2.5rem)', letterSpacing:'0.04em', marginBottom:8 }}>Where the Tax Bites: $1M Gross Income</div>
              <p style={{ color:'#888', fontSize:'0.82rem', marginBottom:24, lineHeight:1.8 }}>
                The SALT cap (2017 Tax Cuts and Jobs Act) limits the state and local tax deduction on federal returns to $10,000 — turning high-state-tax residency into a compounding cost at the federal level too. Here is what the same $1M in gross income looks like across three jurisdictions.
              </p>
              {[
                { label:'Florida / Texas', sublabel:'No state income tax', totalPct:32.8, takeHome:672000, segments:[{ label:'Federal', pct:32.8, color:'#D4A843' }] },
                { label:'California', sublabel:'13.3% state rate', totalPct:47.5, takeHome:525000, segments:[{ label:'Federal', pct:32.8, color:'#D4A843' }, { label:'CA State', pct:11.0, color:'#E07020' }, { label:'SALT Penalty', pct:3.7, color:'#CC3333' }] },
                { label:'New York + NYC', sublabel:'10.9% state + 3.9% city', totalPct:51.3, takeHome:487000, segments:[{ label:'Federal', pct:32.8, color:'#D4A843' }, { label:'NY State', pct:9.5, color:'#E07020' }, { label:'NYC City', pct:3.9, color:'#9966CC' }, { label:'SALT Penalty', pct:5.1, color:'#CC3333' }] },
              ].map(function(scenario) {
                return (
                  <div key={scenario.label} className="card" style={{ padding:'20px 24px', marginBottom:10 }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
                      <div>
                        <span className="bebas" style={{ color:'white', fontSize:'1rem', letterSpacing:'0.04em' }}>{scenario.label}</span>
                        <span style={{ color:'#444', fontSize:'0.68rem', textTransform:'uppercase', letterSpacing:'0.06em', marginLeft:10 }}>{scenario.sublabel}</span>
                      </div>
                      <div style={{ textAlign:'right' }}>
                        <span className="bebas" style={{ color:'#44AA66', fontSize:'0.9rem', letterSpacing:'0.04em' }}>Take home: ${(scenario.takeHome/1000).toFixed(0)}K</span>
                        <span style={{ color:'#CC3333', fontSize:'0.72rem', marginLeft:10 }}>{scenario.totalPct}% to taxes</span>
                      </div>
                    </div>
                    <div style={{ height:28, borderRadius:4, overflow:'hidden', display:'flex', background:'#0d0d0d', marginBottom:10 }}>
                      {scenario.segments.map(function(seg) {
                        return seg.pct > 0 ? (
                          <div key={seg.label} style={{ width:`${seg.pct}%`, background:seg.color, display:'flex', alignItems:'center', justifyContent:'center', transition:'width 0.3s' }}>
                            {seg.pct >= 3 && <span style={{ fontSize:'0.58rem', color:'rgba(0,0,0,0.7)', fontWeight:700, whiteSpace:'nowrap' }}>{seg.pct}%</span>}
                          </div>
                        ) : null;
                      })}
                      <div style={{ flex:1, background:'#1a2a1a', display:'flex', alignItems:'center', justifyContent:'center' }}>
                        <span style={{ fontSize:'0.6rem', color:'#44AA66', fontWeight:600 }}>${(scenario.takeHome/1000).toFixed(0)}K kept</span>
                      </div>
                    </div>
                    <div style={{ display:'flex', flexWrap:'wrap', gap:12 }}>
                      {scenario.segments.map(function(seg) {
                        return (
                          <div key={seg.label} style={{ display:'flex', alignItems:'center', gap:5 }}>
                            <div style={{ width:8, height:8, borderRadius:2, background:seg.color, flexShrink:0 }}/>
                            <span style={{ color:'#555', fontSize:'0.68rem' }}>{seg.label} {seg.pct}%</span>
                          </div>
                        );
                      })}
                      <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                        <div style={{ width:8, height:8, borderRadius:2, background:'#1a2a1a', flexShrink:0, border:'1px solid #44AA66' }}/>
                        <span style={{ color:'#44AA66', fontSize:'0.68rem' }}>Take home {(100 - scenario.totalPct).toFixed(1)}%</span>
                      </div>
                    </div>
                  </div>
                );
              })}
              <div style={{ padding:'14px 18px', background:'#0d0d0d', borderRadius:8, borderLeft:'3px solid #CC3333', marginTop:8 }}>
                <span style={{ color:'#CC3333', fontSize:'0.62rem', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:700 }}>SALT cap impact: </span>
                <span style={{ color:'#666', fontSize:'0.78rem' }}>A NY+NYC resident earning $1M pays roughly $185K more in combined taxes than a Florida or Texas resident on the same income. The SALT cap alone adds $37–51K on top of the state/city tax because those state taxes can no longer be deducted federally.</span>
              </div>
            </div>
            <ComplianceNote>Tax rates and brackets are for illustration and may not reflect the most current figures. Consult a CPA or tax attorney for individual tax planning.</ComplianceNote>
          </div>
        </section>
      );
    }

    function Section2() {
      const [open, setOpen] = useState(null);
      const entities = [
        { name:'LLC', color:'#D4A843', tagline:'Flexibility first', desc:'A Limited Liability Company provides personal liability protection with pass-through taxation by default. Income flows to the owner\'s personal return. No double taxation. Highly flexible — can be taxed as a sole proprietorship, partnership, S-Corp, or C-Corp.', pros:['Liability protection — personal assets shielded from business debts', 'Pass-through taxation by default — no double taxation', 'Minimal formality requirements compared to corporations', 'Flexible profit and loss allocation among members'], cons:['Self-employment tax applies to all net income by default', 'Must be properly maintained to preserve liability protection', 'Less recognized internationally than a corporation'], bestFor:'Image rights, licensing deals, endorsements, real estate holding, and as a base entity for most athletes.' },
        { name:'S-Corp', color:'#44AA66', tagline:'The salary split strategy', desc:'An S-Corporation allows the owner to pay themselves a reasonable salary (subject to payroll/FICA tax) and take remaining profits as a distribution — which is NOT subject to self-employment tax. This "salary split" is the primary tax advantage.', pros:['Payroll tax savings on distributions above reasonable salary', 'Pass-through taxation — no double tax at entity level', 'More credibility with vendors, partners, and banks'], cons:['Requires formal payroll, quarterly filings, and a "reasonable salary"', '100 shareholder limit, one class of stock only', 'IRS scrutiny if salary is set unreasonably low', 'More administrative overhead than a plain LLC'], bestFor:'Athletes with $200K+ in net endorsement or business income where FICA savings on distributions are meaningful.' },
        { name:'C-Corp', color:'#4488CC', tagline:'For builders with a long horizon', desc:'A C-Corporation is a separate taxable entity paying corporate tax (flat 21%) on retained earnings. Shareholders pay personal tax again on dividends — creating "double taxation." However, for athletes building real operating businesses, this structure has specific strategic advantages.', pros:['Flat 21% corporate tax rate on retained earnings', 'Unlimited shareholders and multiple classes of stock', 'Easier to raise institutional capital and issue equity to employees', 'QSBS exclusion — potentially exclude $10M+ in gains on qualifying stock'], cons:['Double taxation on profits distributed as dividends', 'Most complex structure to maintain', 'Not efficient for passive investment or simple income holding'], bestFor:'Athletes building operating businesses with scale ambitions, or for holding startup equity where the QSBS gain exclusion applies.' },
      ];
      return (
        <section id="entities" style={{ padding:'80px 0', background:'#080808' }}>
          <div className="container">
            <SectionLabel num="02" title="Business Entities" />
            <p style={{ color:'#888', marginBottom:40, maxWidth:640, lineHeight:1.9 }}>Every professional athlete's financial life should run through at least one legal entity. Not for tax avoidance — for liability protection, income management, and long-term flexibility. The question isn't whether to have an entity. It's which one, and for what purpose.</p>
            <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:40 }}>
              {entities.map((e, i) => (
                <div key={e.name} style={{ borderRadius:10, overflow:'hidden', cursor:'pointer', border:`1px solid ${open===i ? e.color+'40' : '#1a1a1a'}`, transition:'border-color 0.2s' }}>
                  <div onClick={() => setOpen(open===i ? null : i)} style={{ padding:'18px 24px', display:'flex', justifyContent:'space-between', alignItems:'center', background: open===i ? `${e.color}08` : '#0d0d0d' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:16 }}>
                      <span className="bebas" style={{ color:e.color, fontSize:'1.4rem', letterSpacing:'0.05em' }}>{e.name}</span>
